services:
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LocalDemoOnly!2026}
      DB_URL: jdbc:postgresql://postgres:5432/roster
      DB_USERNAME: roster
      DB_PASSWORD: ${DB_PASSWORD:-local-postgres-only}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://localhost:8080/api/v1/auth/jwks}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-roster-api}
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: roster
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-local-rabbit-only}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-only}
      SNAPSHOT_STORAGE: /data/snapshots
      SNAPSHOT_BATCH_SIZE: ${SNAPSHOT_BATCH_SIZE:-5000}
      MISSING_EMPLOYEE_THRESHOLD: ${MISSING_EMPLOYEE_THRESHOLD:-0.30}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-PT60S}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["snapshot-data:/data/snapshots"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roster
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-postgres-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster -d roster"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local-redis-only}"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-local-redis-only}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: roster
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-local-rabbit-only}
    ports: ["127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  snapshot-data:
  rabbit-data:
