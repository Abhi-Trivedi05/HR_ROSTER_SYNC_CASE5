name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and wait for the complete application
        run: docker compose up --build --wait --wait-timeout 240
      - name: Exercise the running application and its dependencies
        run: python3 tools/compose_smoke.py
      - name: Capture container state and logs
        if: always()
        run: |
          mkdir -p compose-reports
          docker compose ps --all > compose-reports/status.txt
          docker compose logs --no-color > compose-reports/containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke-reports
          path: compose-reports
      - name: Stop the test stack
        if: always()
        run: docker compose down
